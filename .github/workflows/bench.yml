name: bench

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build toolkit
        working-directory: toolkit
        run: npm ci && npm run build

      - name: Install bench
        working-directory: bench
        run: npm ci --no-audit --no-fund

      - name: Bench unit tests
        working-directory: bench
        run: npm test

      - name: Stage A regression gate
        working-directory: bench
        run: node run.mjs --stage a --corpus fixtures --gate 1
